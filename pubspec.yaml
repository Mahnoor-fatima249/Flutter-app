name: ai_personal_stylist
description: AI-Powered Personal Stylist & Wardrobe App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Image Handling
  image_picker: ^1.1.2
  image: ^4.3.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # AI & Local Storage

  # AR / Virtual Try-On
  model_viewer_plus: ^1.7.8

  # UI Components
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  fl_chart: ^0.69.2
  percent_indicator: ^4.2.3
  flutter_slidable: ^3.1.1

  # Voice (Offline TTS + STT)
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.1
  
  # URL Launcher (for email)
  url_launcher: ^6.3.1

  # Preferences
  shared_preferences: ^2.3.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
